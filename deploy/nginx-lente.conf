# Nginx en la VM-APP: sirve el build (dist/) y pasa /api al backend FastAPI local.
# Copiar a /etc/nginx/sites-available/lente y enlazar en sites-enabled.
server {
    listen 80;
    server_name _;

    root /var/www/lente;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Rutas de React (/cursos/3, /actividad/12…) siempre devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
